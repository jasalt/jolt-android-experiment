# Lima sandbox for Jolt Android and portable-core development on native hosts.
#
# Project dependencies belong in flake.nix. This file installs only the guest
# facilities needed before `nix develop` can work: Nix itself, SSH/X11 support,
# a virtual X desktop with VNC, and a small agent/tooling baseline.
#
# Create the instance from the host with:
#   limactl start --name=jolt-android ./lima-vm.yaml
# See docs/LIMA.md for provisioning, VNC, lifecycle, and diagnostics.

minimumLimaVersion: 2.0.0

base:
- template:_images/fedora

# Do not set `arch`: Lima selects the host-native architecture. This produces
# x86_64 Fedora guests on the Linux Android-integration host and aarch64 Fedora
# guests on Apple Silicon macOS. Do not use a foreign-architecture VM for normal
# portable-core development; QEMU system emulation is much slower. Android
# emulator acceleration remains a host capability and is diagnosed, not assumed.

# Android SDK/NDK builds, Chez/Jolt native compilation, and an emulator need
# substantially more headroom than Lima's defaults on Linux. On Apple Silicon,
# these are upper bounds for a native portable-core VM; reduce them in a local
# template if Android tooling is not being used. These are initial defaults;
# stop the VM and edit its instance configuration if the host cannot provide
# them.
cpus: 8
memory: 16GiB
disk: 100GiB

# Keep the source tree on the host so editor/agent changes survive VM deletion.
# Lima has no config-relative project-directory template, so the portable
# default mounts the host home at the same path. This is a deliberate trust
# boundary: code in the guest can modify the host home. See docs/LIMA.md for a
# stricter copy/clone-on-guest alternative.
mounts:
- location: "~"
  writable: true
mountInotify: true

# There is no container runtime in this VM. Nix supplies the reproducible
# project environment and performs sandboxed builds through nix-daemon.
containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail

    # Keep the mutable VM base intentionally small. Android/Jolt versions and
    # build dependencies must be pinned by the repository flake, not DNF.
    dnf -y install \
      ca-certificates curl git gzip bzip2 xz tar unzip which findutils iproute \
      openssh-server xorg-x11-xauth \
      tmux fd-find ripgrep jq socat nmap-ncat \
      npm chromium kitty-terminfo \
      xorg-x11-server-Xvfb openbox x11vnc ffmpeg-free xdotool \
      xdpyinfo xprop glx-utils mesa-dri-drivers mesa-libGL

    # Nix is the project dependency boundary. Fedora's package sets up the
    # build users and systemd daemon without running an unpinned curl installer.
    dnf -y install nix nix-daemon
    install -d -m 0755 /etc/nix
    touch /etc/nix/nix.conf
    if ! grep -q '^experimental-features[[:space:]]*=' /etc/nix/nix.conf; then
      printf '%s\n' 'experimental-features = nix-command flakes' >>/etc/nix/nix.conf
    fi
    if ! grep -q '^sandbox[[:space:]]*=' /etc/nix/nix.conf; then
      printf '%s\n' 'sandbox = true' >>/etc/nix/nix.conf
    fi
    systemctl enable --now nix-daemon.socket

    # Optional host-display forwarding is useful for quick checks. The stable
    # automation and inspection display is the loopback-only VNC desktop below.
    install -d -m 0755 /etc/ssh/sshd_config.d
    cat >/etc/ssh/sshd_config.d/99-lima-x11.conf <<'EOF'
    X11Forwarding yes
    X11UseLocalhost yes
    XAuthLocation /usr/bin/xauth
    EOF
    sshd -t
    systemctl restart sshd

    # A direct X11 desktop is simpler and more observable than nesting Weston:
    # Android emulator / GTK -> Xvfb -> FFmpeg or x11vnc -> SSH tunnel -> host.
    # x11vnc never listens beyond guest loopback; the SSH tunnel is the access
    # control and transport-security boundary.
    cat >/usr/local/bin/lima-x11 <<'SCRIPT'
    #!/bin/bash
    set -euo pipefail

    display="${LIMA_X11_DISPLAY:-:99}"
    screen="${LIMA_X11_SCREEN:-1280x800x24}"
    # Use a non-default VNC/X11 desktop port so this VM can coexist with
    # another Lima instance whose desktop occupies port 5900.
    vnc_port="${LIMA_VNC_PORT:-5901}"
    display_number="${display#:}"
    display_number="${display_number%%.*}"
    # Use a stable user-owned location so the system unit (which has no
    # XDG_RUNTIME_DIR) and interactive shells share state and logs.
    state_dir="${LIMA_X11_STATE_DIR:-/tmp/lima-x11-${UID}}/lima-x11-${display_number}"

    mkdir -p "$state_dir"
    chmod 0700 "$state_dir"

    running() {
      local name="$1" pid_file="$state_dir/$1.pid" pid
      [[ -r "$pid_file" ]] || return 1
      read -r pid <"$pid_file"
      [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null
    }

    start_process() {
      local name="$1"
      shift
      if running "$name"; then
        return 0
      fi
      rm -f "$state_dir/$name.pid"
      setsid "$@" </dev/null >"$state_dir/$name.log" 2>&1 &
      echo "$!" >"$state_dir/$name.pid"
    }

    stop_process() {
      local name="$1" pid_file="$state_dir/$1.pid" pid
      [[ -r "$pid_file" ]] || return 0
      read -r pid <"$pid_file"
      if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
        kill "$pid" 2>/dev/null || true
        for _ in $(seq 1 30); do
          kill -0 "$pid" 2>/dev/null || break
          sleep 0.1
        done
        kill -KILL "$pid" 2>/dev/null || true
      fi
      rm -f "$pid_file"
    }

    status() {
      local failed=0 name
      printf 'DISPLAY=%s screen=%s VNC=127.0.0.1:%s\n' \
        "$display" "$screen" "$vnc_port"
      printf 'logs=%s\n' "$state_dir"
      for name in Xvfb openbox x11vnc; do
        if running "$name"; then
          printf '%-8s running (pid %s)\n' \
            "$name" "$(cat "$state_dir/$name.pid")"
        else
          printf '%-8s stopped\n' "$name"
          failed=1
        fi
      done
      return "$failed"
    }

    case "${1:-}" in
      start)
        start_process Xvfb Xvfb "$display" -screen 0 "$screen" -nolisten tcp
        ready=false
        for _ in $(seq 1 100); do
          if DISPLAY="$display" xdpyinfo >/dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 0.1
        done
        if [[ "$ready" != true ]]; then
          echo "Xvfb did not become ready; see $state_dir/Xvfb.log" >&2
          stop_process Xvfb
          exit 1
        fi
        start_process openbox env DISPLAY="$display" openbox
        start_process x11vnc x11vnc \
          -display "$display" -localhost -forever -shared -nopw \
          -rfbport "$vnc_port"
        for _ in $(seq 1 50); do
          if ss -ltn | grep -q "127.0.0.1:${vnc_port}"; then
            status
            exit 0
          fi
          sleep 0.1
        done
        echo "x11vnc did not listen; see $state_dir/x11vnc.log" >&2
        exit 1
        ;;
      stop)
        # Stop consumers before the X server. Never remove X lock/socket files
        # manually while Xvfb is alive.
        stop_process x11vnc
        stop_process openbox
        stop_process Xvfb
        ;;
      restart)
        "$0" stop
        "$0" start
        ;;
      status)
        status
        ;;
      logs)
        printf '%s\n' "$state_dir"
        ;;
      *)
        echo "usage: lima-x11 {start|stop|restart|status|logs}" >&2
        exit 2
        ;;
    esac
    SCRIPT
    chmod 0755 /usr/local/bin/lima-x11

    # Bring up the direct-X11 inspection desktop at every VM boot. It runs as
    # the unprivileged Lima user and exposes VNC only on guest loopback.
    cat >/etc/systemd/system/lima-x11.service <<'UNIT'
    [Unit]
    Description=Lima virtual X11 desktop for GUI inspection
    After=network.target

    [Service]
    Type=oneshot
    User={{.User}}
    Environment=LIMA_X11_DISPLAY=:99
    Environment=LIMA_X11_SCREEN=1280x800x24
    Environment=LIMA_VNC_PORT=5901
    RemainAfterExit=yes
    ExecStart=/usr/local/bin/lima-x11 start
    ExecStop=/usr/local/bin/lima-x11 stop

    [Install]
    WantedBy=multi-user.target
    UNIT
    systemctl daemon-reload
    systemctl enable --now lima-x11.service

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    mkdir -p "$HOME/.config" "$HOME/.local/bin"
    export PATH="$HOME/.local/bin:$PATH"
    grep -qxF 'export PATH="$HOME/.local/bin:$PATH"' "$HOME/.bashrc" 2>/dev/null || \
      printf '%s\n' 'export PATH="$HOME/.local/bin:$PATH"' >>"$HOME/.bashrc"

    # Beads is the durable project task tracker. Install the official release
    # binaries for this guest architecture; both installers prefer ~/.local/bin
    # for an unprivileged user and fall back to a verified source build only if
    # a release asset is unavailable.
    curl -fsSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash
    curl -fsSL https://raw.githubusercontent.com/Dicklesworthstone/beads_viewer/main/install.sh | bash
    command -v bd
    command -v bv
    bd version
    bv --version

    # Pi is the user-facing coding harness, not a project dependency and not a
    # system service. Keep its npm prefix and executable in the Lima user's
    # home so `pi` works without root or a system-wide npm-prefix assumption.
    node - <<'NODE'
    const [major, minor] = process.versions.node.split('.').map(Number)
    if (major < 22 || (major === 22 && minor < 19)) {
      console.error(`Pi requires Node >=22.19; found ${process.version}`)
      process.exit(1)
    }
    NODE
    npm config set prefix '~/.local'
    npm install --global --ignore-scripts \
      agent-browser @earendil-works/pi-coding-agent
    test -x "$HOME/.local/bin/pi"
    "$HOME/.local/bin/pi" --version

probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v nix >/dev/null
    test -x "$HOME/.local/bin/pi"
    "$HOME/.local/bin/pi" --version
    command -v Xvfb >/dev/null
    command -v x11vnc >/dev/null
    command -v ffmpeg >/dev/null
    command -v xdotool >/dev/null
    command -v lima-x11 >/dev/null
    command -v bd >/dev/null
    command -v bv >/dev/null
    systemctl is-active --quiet nix-daemon.socket
    systemctl is-active --quiet lima-x11.service
    DISPLAY=:99 xdpyinfo >/dev/null
    ss -ltn | grep -q '127.0.0.1:5901'
    nix --extra-experimental-features 'nix-command flakes' --version
  hint: |-
    Guest provisioning failed. Inspect /var/log/cloud-init-output.log and run:
      systemctl status nix-daemon.socket
      command -v nix Xvfb x11vnc ffmpeg xdotool lima-x11
      "$HOME/.local/bin/pi" --version

# Remote display via VNC
# Do not enable Lima's SSH X11 forwarding here. Lima derives the forwarded X11
# listener from the host DISPLAY (typically TCP 6010 for DISPLAY=:0), so two
# Lima instances can collide before the VM reaches running state. The isolated
# Xvfb/Openbox desktop above is the stable GUI target and is exposed through
# the separately assigned VNC port instead.
ssh:
  forwardX11: false
  forwardX11Trusted: false

message: |
  Jolt Android development VM {{.Name}} is ready.

  Enter it:
    limactl shell {{.Name}}

  The host home is mounted at the same path. From this repository run:
    nix develop
    pi

  The isolated GUI desktop starts automatically at boot. In the guest use:
    export DISPLAY=:99
    lima-x11 status

  Lima should forward the guest VNC port automatically but if not, from the
  host, tunnel its loopback-only VNC endpoint:
    ssh -F ~/.lima/{{.Name}}/ssh.config -N -T \
      -L 127.0.0.1:5901:127.0.0.1:5901 lima-{{.Name}}

  Then point a VNC viewer at 127.0.0.1:5901. No VNC password is used because
  x11vnc is guest-loopback-only and reachable only through Lima SSH.

  Full lifecycle, VNC, screenshots, resource tuning, and troubleshooting:
    docs/LIMA.md
