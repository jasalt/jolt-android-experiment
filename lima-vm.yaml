# A template to use Podman instead of containerd & nerdctl
# $ limactl start ./podman.yaml
# $ limactl shell podman podman run -it -v $HOME:$HOME --rm docker.io/library/alpine

# To run `podman` on the host (assumes podman-remote is installed):
# $ export CONTAINER_HOST=$(limactl list podman --format 'unix://{{.Dir}}/sock/podman.sock')
# $ podman --remote ...

# To run `docker` on the host (assumes docker-cli is installed):
# $ export DOCKER_HOST=$(limactl list podman --format 'unix://{{.Dir}}/sock/podman.sock')
# $ docker ...

minimumLimaVersion: 2.0.0

base:
- template:_images/fedora
- template:_default/mounts

containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail

    # X11 Forwarding support
    dnf -y install xorg-x11-xauth
    install -d -m 0755 /etc/ssh/sshd_config.d
    cat >/etc/ssh/sshd_config.d/99-lima-x11.conf <<'EOF'
    X11Forwarding yes
    X11UseLocalhost yes
    XAuthLocation /usr/bin/xauth
    EOF
    sshd -t
    systemctl restart sshd

    dnf -y install tmux fd-find python3-dnf python3-libselinux npm ripgrep chromium-browser kitty-terminfo
    npm install -g --ignore-scripts agent-browser @earendil-works/pi-coding-agent

    # Docker
    dnf config-manager addrepo --from-repofile https://download.docker.com/linux/fedora/docker-ce.repo
    dnf install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    systemctl enable --now docker

    # DDEV
    echo '[ddev]
    name=ddev
    baseurl=https://pkg.ddev.com/yum/
    gpgcheck=0
    enabled=1' | sed 's/^ \+//' | sudo tee /etc/yum.repos.d/ddev.repo >/dev/null

    dnf install ddev
    mkcert -install


    command -v podman >/dev/null 2>&1 && test -e /etc/lima-podman && exit 0
    dnf -y install --best podman && touch /etc/lima-podman

- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    sudo groupadd -f docker && sudo usermod -aG docker ${SUDO_USER:-$USER}
    systemctl --user enable --now podman.socket

probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 30s bash -c "until command -v podman >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "podman is not installed yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
ssh:
  forwardX11: true
  forwardX11Trusted: false  # Optional, set to true for trusted forwarding
portForwards:
- guestSocket: "/run/user/{{.UID}}/podman/podman.sock"
  hostSocket: "{{.Dir}}/sock/podman.sock"
message: |
  To run `podman` on the host (assumes podman-remote is installed), run the following commands:
  ------
  podman system connection add lima-{{.Name}} "unix://{{.Dir}}/sock/podman.sock"
  podman system connection default lima-{{.Name}}
  podman{{if eq .HostOS "linux"}} --remote{{end}} run quay.io/podman/hello
  ------
