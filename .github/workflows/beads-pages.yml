name: Publish Beads task dashboard

on:
  push:
    branches: [master]
    paths:
      - ".beads/issues.jsonl"
      - ".github/workflows/beads-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Beads Viewer
        env:
          BV_VERSION: v0.22.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Dicklesworthstone/beads_viewer/releases/download/${BV_VERSION}/bv_linux_amd64.tar.gz" \
            --output /tmp/bv.tar.gz
          tar -xzf /tmp/bv.tar.gz -C /tmp
          install -m 0755 /tmp/bv /usr/local/bin/bv
          bv --version

      - name: Export static dashboard
        run: bv --export-pages html-output

      - name: Publish dashboard under /bv/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: html-output
          target-folder: bv
          clean: false
          single-commit: false

      - name: Create repository redirect at site root
        run: |
          set -euo pipefail
          mkdir -p site-root
          cat > site-root/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://github.com/jasalt/jolt-android-experiment">
          <title>Jolt Android PoC</title>
          <p>Redirecting to the <a href="https://github.com/jasalt/jolt-android-experiment">GitHub repository</a>…</p>
          <script>location.replace('https://github.com/jasalt/jolt-android-experiment');</script>
          EOF

      - name: Publish repository redirect at site root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: site-root
          clean: false
          single-commit: false
